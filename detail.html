<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting… — TrekkingWays</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p style="padding:3rem 1.5rem; max-width:640px; margin:0 auto;">
        Redirecting you to the trek page… if you're not redirected automatically,
        <a href="index.html" id="fallback-link">browse all routes</a>.
    </p>

    <script>
        // Legacy URL support: detail.html?tour=tour-1 used to render everything
        // client-side. Each trek now lives at its own static, indexable URL —
        // this page just forwards old links (bookmarks, past shares, old GYG
        // referral links) to the right place.
        const redirectMap = {
            "tour-1": "scottish-highlands-whisky-tasting.html",
            "tour-2": "finisterre-muxia-costa-da-morte.html",
            "tour-3": "mount-etna-summit-trek.html"
        };

        const params = new URLSearchParams(window.location.search);
        const tourId = params.get('tour');
        const target = redirectMap[tourId];

        if (target) {
            document.getElementById('fallback-link').href = target;
            window.location.replace(target);
        }
    </script>
</body>
</html>
